# What tools/build-packages.sh needs to know about this package (sourced by sh).
# SPDX-License-Identifier: Apache-2.0

NAME=azentrius-repository
SUMMARY="Package repository of the Azentrius Cockpit add-ons"
DESCRIPTION="Adds packages.azentrius.de to apt or dnf, with its signing key, and the AppStream catalog that lets Cockpit list the Azentrius add-ons under Applications, ready to install."
HOMEPAGE=https://github.com/Azentrius/packages
MAINTAINER="Azentrius <support@azentrius.de>"
LICENSE="Apache-2.0 AND CC0-1.0"

# One dependency per line.
DEB_DEPENDS="ca-certificates"
RPM_REQUIRES="ca-certificates"

# What the package owns below the staged root (directories are taken whole).
FILES="/usr/share/keyrings/azentrius.asc
/usr/share/swcatalog/xml/azentrius.xml
/usr/share/doc/azentrius-repository"

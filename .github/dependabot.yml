# Dependabot version updates for the Python check tools in test/ and the GitHub
# Actions used in .github/workflows. The packages themselves have no dependencies to pin.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/test"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      check-tools:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

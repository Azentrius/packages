# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, runs the checks, builds azentrius-repository (.deb, .rpm) and creates the
# tag vVERSION with a GitHub release (packages, SHA256SUMS, signed build provenance, notes from
# CHANGELOG.md). packages.azentrius.de takes the packages from there within an hour.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0 (empty: the one in VERSION)"
        required: false
        default: ""

permissions:
  contents: write       # tag and release
  id-token: write       # signing the build provenance
  attestations: write   # storing the build provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(sh tools/check-version.sh)
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from VERSION ($code). Change VERSION first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checks
        run: make check

      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm > /dev/null
          make packages
          (cd dist && sha256sum *.deb *.rpm) > SHA256SUMS

      - name: Build provenance for the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh tools/release-notes.sh "$VERSION" > notes.md
          {
            echo
            echo "### Set up"
            echo
            echo "See https://packages.azentrius.de/ or the README. The packages here are the same that"
            echo "packages.azentrius.de serves (the RPM there additionally carries the repository's signature)."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" dist/*.deb dist/*.rpm SHA256SUMS --target "$GITHUB_SHA" --title "Azentrius packages $VERSION" --notes-file notes.md

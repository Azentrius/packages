# nginx site for packages.azentrius.de (/etc/nginx/sites-available/packages.azentrius.de).
server {
    listen 80;
    listen [::]:80;
    server_name packages.azentrius.de;

    location /.well-known/acme-challenge/ {
        root /var/www/packages.azentrius.de;
    }
    location / {
        return 301 https://packages.azentrius.de$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name packages.azentrius.de;

    ssl_certificate     /etc/letsencrypt/live/packages.azentrius.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/packages.azentrius.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;

    root /var/www/packages.azentrius.de;
    index index.html;
    autoindex off;

    # Half-written files (.name.part) and anything else hidden stay out.
    location ~ /\. {
        deny all;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
